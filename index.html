<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sening bilan baxtliman ❤️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dinamik o'zgaruvchi xira fon -->
    <div id="bg-blur"></div>

    <div class="book-container">
        <div class="book" id="book">
            <!-- Sahifalar JS orqali chiqadi -->
        </div>
    </div>

    <!-- Musiqa Pleyeri -->
    <div class="player-container">
        <div class="player-content">
            <div class="album-art">
                <img src="images/1.jpg" id="track-art" class="rotating">
            </div>
            
            <div class="song-details">
                <h2 id="song-name">KUSURAMA BAKMA</h2>
                <p id="artist-name">BLOK3</p>
                
                <div class="controls">
                    <button id="prev-btn"><i class="fas fa-step-backward"></i></button>
                    <button id="play-pause"><i class="fas fa-play"></i></button>
                    <button id="next-btn"><i class="fas fa-step-forward"></i></button>
                </div>

                <div class="progress-area">
                    <span id="current-time">0:00</span>
                    <div class="bar-container">
                        <input type="range" id="progress-bar" min="0" max="100" value="0">
                    </div>
                    <span id="total-duration">0:00</span>
                </div>
            </div>
        </div>
    </div>

    <audio id="bgMusic"></audio>

    <script src="script.js"></script>
</body>
</html>
